name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default
  BASH_ENV: ${{ github.workspace }}/scripts/assurance/env.sh

permissions:
  contents: read

jobs:
  test:
    name: forge fmt / build / test
    runs-on: ubuntu-24.04
    steps:
      # Dependencies live vendored under lib/ (committed, not git submodules),
      # so no submodule checkout or `forge install` is needed.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      - name: Install checksum and hash-locked tools
        run: python3 scripts/assurance/install.py

      - name: Run repository-wide checks
        run: scripts/check.sh --repository-only

      - name: Build and smoke production service images
        run: scripts/production-container-smoke.sh

      - name: Build and validate Monad hackathon demo image
        run: scripts/hackathon-monad-container-smoke.sh
