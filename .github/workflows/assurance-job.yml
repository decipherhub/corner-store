name: Assurance job

on:
  workflow_call:
    inputs:
      task:
        required: true
        type: string
      deep:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: ${{ inputs.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.deep && 60 || 15 }}
    env:
      BASH_ENV: ${{ github.workspace }}/scripts/assurance/env.sh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Provision checksum and hash-locked tools
        run: python3 scripts/assurance/install.py
      - name: Verify pinned tools and gate-harness regressions
        run: |
          python scripts/assurance/verify_tools.py
          python -m unittest discover -s scripts/assurance -p 'test_*.py'
      - name: Install locked dependencies
        run: scripts/assurance/install-deps.sh
      - name: Verify offline Python provisioning
        run: python3 scripts/assurance/install.py --offline
      - name: Run assurance gate
        env:
          ASSURANCE_DEEP: ${{ inputs.deep }}
          ASSURANCE_TASK: ${{ inputs.task }}
        run: |
          if [ "$ASSURANCE_DEEP" = true ]; then
            scripts/assurance/run.sh "$ASSURANCE_TASK" --deep
          else
            scripts/assurance/run.sh "$ASSURANCE_TASK"
          fi
      - name: Retain reports, patches, mapped tests, seeds and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assurance-${{ inputs.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .assurance/reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
