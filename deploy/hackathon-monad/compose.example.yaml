name: corner-store-monad-hackathon

services:
  demo:
    build:
      context: ../..
      dockerfile: deploy/hackathon-monad/Dockerfile
    image: corner-store-monad-hackathon:local
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    restart: unless-stopped
    environment:
      CORNER_STORE_TESTNET_ARTIFACT: /run/corner-store/deployment.json
      CORNER_STORE_TESTNET_RPC_URL: "${CORNER_STORE_TESTNET_RPC_URL:?set the Monad RPC URL}"
      CORNER_STORE_TESTNET_EXPLORER_URL: "${CORNER_STORE_TESTNET_EXPLORER_URL:-https://testnet.monadexplorer.com}"
      CORNER_STORE_TESTNET_MAKER_KEY_FILE: /run/secrets/maker_key
      CORNER_STORE_TESTNET_QUOTE_REQUESTS_PER_MINUTE: "${CORNER_STORE_TESTNET_QUOTE_REQUESTS_PER_MINUTE:-20}"
    volumes:
      - "${CORNER_STORE_TESTNET_ARTIFACT:?set the verified deployment artifact}:/run/corner-store/deployment.json:ro"
    secrets:
      - maker_key
    ports:
      - "127.0.0.1:${CORNER_STORE_TESTNET_DEMO_PORT:-8791}:8791"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128

secrets:
  maker_key:
    file: "${CORNER_STORE_TESTNET_MAKER_KEY_FILE:?set a file containing the disposable testnet Maker key}"
